<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Engagement Performance Goal</title>

<style>

/* =========================================
   RESET
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
}

body{
    background:#f7f5f8;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    color:#111;

    display:flex;
    justify-content:center;
}


/* =========================================
   APP
========================================= */

.app{
    width:100%;
    max-width:580px;

    min-height:100vh;

    background:#f7f5f8;

    box-shadow:
        0 0 30px
        rgba(0,0,0,.08);
}


/* =========================================
   HEADER
========================================= */

.header{
    background:#f7f5f8;

    padding:
        max(18px, env(safe-area-inset-top))
        20px
        18px;
}

.header-row{
    min-height:48px;

    position:relative;

    display:flex;
    justify-content:center;
    align-items:center;
}


/* BACK */

.back-button{
    position:absolute;

    left:0;

    width:38px;
    height:38px;

    display:flex;
    justify-content:center;
    align-items:center;
}

.back-arrow{
    width:15px;
    height:15px;

    border-left:3px solid #111;
    border-bottom:3px solid #111;

    transform:rotate(45deg);
}


/* TITLE */

.header-title{
    font-size:25px;
    font-weight:800;
}


/* TARGET BADGE */

.goal-badge{
    position:absolute;

    right:0;

    background:#111;
    color:#f7f5f8;

    padding:7px 10px;

    border-radius:18px;

    font-size:9px;
    font-weight:800;

    letter-spacing:.5px;
}


/* =========================================
   VIDEO INFO
========================================= */

.video-info{
    background:#f7f5f8;

    display:flex;
    flex-direction:column;
    align-items:center;

    padding:
        20px
        18px
        22px;
}


/* TOP THUMBNAIL */

.top-thumbnail{
    position:relative;

    width:115px;
    height:154px;

    border-radius:10px;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            #e7b0bc,
            #c98c9a,
            #80606b
        );
}


/*
   OPTIONAL:
   If png2.png exists,
   it will also appear here.
*/

.top-thumbnail img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
}


/* DURATION */

.video-duration{
    position:absolute;

    left:0;
    right:0;
    bottom:7px;

    color:#f7f5f8;

    text-align:center;

    font-size:19px;
    font-weight:800;

    text-shadow:
        0 1px 4px
        rgba(0,0,0,.75);
}


/* DATE */

.post-date{
    margin-top:14px;

    color:#666;

    font-size:16px;

    text-align:center;
}


/* =========================================
   STATS
========================================= */

.stats{
    width:100%;

    margin-top:22px;

    display:grid;

    grid-template-columns:
        repeat(5,minmax(0,1fr));
}

.stat{
    min-width:0;

    position:relative;

    display:flex;
    flex-direction:column;

    align-items:center;

    gap:8px;
}

.stat:not(:last-child)::after{
    content:"";

    position:absolute;

    right:0;
    top:5px;

    height:31px;

    border-right:1px solid #eee;
}

.stat-icon{
    height:28px;

    display:flex;
    justify-content:center;
    align-items:center;

    color:#aaa;
}

.stat-value{
    font-size:18px;
    font-weight:800;
}


/* PLAY */

.play-icon{
    width:0;
    height:0;

    border-top:10px solid transparent;
    border-bottom:10px solid transparent;

    border-left:17px solid #aaa;
}


/* HEART */

.heart-icon{
    color:#aaa;

    font-size:26px;

    line-height:1;
}


/* COMMENT */

.comment-icon{
    position:relative;

    width:23px;
    height:18px;

    border-radius:11px;

    background:#aaa;
}

.comment-icon::after{
    content:"";

    position:absolute;

    bottom:-4px;
    right:4px;

    width:7px;
    height:7px;

    background:#aaa;

    transform:rotate(35deg);
}

.comment-dots{
    position:absolute;

    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    gap:2px;
}

.comment-dots i{
    width:3px;
    height:3px;

    background:#fff;

    border-radius:50%;

    display:block;
}


/* SHARE */

.share-icon{
    position:relative;

    width:24px;
    height:21px;
}

.share-icon::before{
    content:"";

    position:absolute;

    right:0;
    top:0;

    width:0;
    height:0;

    border-top:10px solid transparent;
    border-bottom:10px solid transparent;

    border-left:17px solid #aaa;
}

.share-icon::after{
    content:"";

    position:absolute;

    left:0;
    top:10px;

    width:16px;
    height:9px;

    border-top:6px solid #aaa;

    border-radius:13px 0 0 0;
}


/* BOOKMARK */

.bookmark-icon{
    width:15px;
    height:22px;

    background:#aaa;

    clip-path:
        polygon(
            0 0,
            100% 0,
            100% 100%,
            50% 74%,
            0 100%
        );
}


/* =========================================
   TABS
========================================= */

.tabs{
    width:100%;

    display:flex;

    background:#f7f5f8;

    border-bottom:1px solid #ddd;
}
.tab{
    flex:1;
    text-align:center;
    padding:20px 3px 15px;
    font-size:15px;
    font-weight:700;
    color:#888;

    text-decoration:none;
    display:block;
}

.tab:visited{
    color:#888;
}

.tab:hover{
    color:#111;
}

.tab.active{
    color:#111;
    border-bottom:3px solid #111;
}

.tab.active:visited{
    color:#111;
}
.tab{
    flex:1;
    min-width:0;

    position:relative;

    padding:
        18px
        2px
        14px;

    color:#777;

    text-align:center;

    font-size:15px;
    font-weight:700;

    white-space:nowrap;
}

.tab.active{
    color:#111;
}

.tab.active::after{
    content:"";

    position:absolute;

    left:12%;
    right:12%;
    bottom:0;

    height:3px;

    background:#111;
}


/* =========================================
   CONTENT
========================================= */

.content{
    padding:
        12px
        10px
        35px;
}


/* CARD */

.panel{
    background:#f7f5f8;

    border-radius:12px;

    padding:
        25px
        22px;

    margin-bottom:12px;

    box-shadow:
        0 1px 2px
        rgba(0,0,0,.02);
}


/* PANEL TITLE */

.panel-title{
    display:flex;
    align-items:center;

    gap:7px;

    font-size:22px;
    font-weight:800;

    margin-bottom:7px;
}


/* INFO ICON */

.info{
    width:18px;
    height:18px;

    border:1.5px solid #888;

    border-radius:50%;

    display:inline-flex;

    justify-content:center;
    align-items:center;

    color:#777;

    font-size:11px;
    font-weight:700;
}


/* DESCRIPTION */

.panel-description{
    color:#777;

    font-size:16px;

    line-height:1.45;
}


/* =========================================
   LIKES SECTION
========================================= */

.likes-panel{
    padding-bottom:30px;
}

.likes-description{
    margin-top:25px;

    color:#777;

    font-size:16px;

    line-height:1.5;
}

.target-time{
    color:#111;

    font-weight:800;
}


/* =========================================
   BIG VIDEO PREVIEW
========================================= */

.video-preview{
    position:relative;

    width:235px;
    max-width:72vw;

    aspect-ratio:9/14.4;

    margin:
        28px
        auto
        30px;

    border-radius:6px;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            #d7a1aa,
            #bb828d,
            #76545e
        );
}


/*
   IMPORTANT:

*/

.video-preview img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
}


/* IMAGE FALLBACK */

.image-fallback{
    position:absolute;

    inset:0;

    z-index:0;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    color:#fff;

    text-align:center;

    padding:20px;

    background:
        linear-gradient(
            145deg,
            #dfa2ad,
            #b77b87

}

.image-fallback strong{
    font-size:18px;

    margin-bottom:7px;
}

.image-fallback span{
    font-size:12px;

    opacity:.85;
}


/* VIDEO IMAGE */

.preview-image{
    position:relative;

    z-index:1;
}


/* PLAY BUTTON */

.big-play{
    position:absolute;

    z-index:3;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:0;
    height:0;

    border-top:
        20px solid transparent;

    border-bottom:
        20px solid transparent;

    border-left:
        32px solid #fff;

    filter:
        drop-shadow(
            0 2px 3px
            rgba(0,0,0,.18)
        );
}


/* TARGET TIME CHIP */

.time-chip{
    position:absolute;

    z-index:4;

    left:10px;
    bottom:10px;

    background:
        rgba(0,0,0,.72);

    color:#fff;

    padding:
        5px

    border-radius:5px;

    font-size:12px;
    font-weight:800;
}


/* =========================================
   CHART
========================================= */

.chart-wrapper{
    width:100%;

    height:200px;

    position:relative;

    overflow:hidden;

    margin-top:10px;
}

#likesChart{
    display:block;

    width:100%;

    height:100%;
}


/* =========================================
   SLIDER
========================================= */

.timeline{
    position:relative;

    width:calc(100% - 45px);

    height:34px;

    margin-top:0;
}

.timeline-line{
    position:absolute;

    left:0;
    right:0;
    top:15px;

    height:5px;

    background:#ddd;

    border-radius:10px;
}

.timeline-handle{
    position:absolute;

    left:-18px;
    top:-1px;

    width:38px;
    height:38px;

    border-radius:50%;

    background:#fff;

    border:1px solid #ddd;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,.14);
}

.timeline-labels{
    display:flex;

    justify-content:space-between;

    color:#777;

    font-size:13px;

    margin-top:2px;
}


/* =========================================
   GOAL NOTICE
========================================= */

.goal-notice{
    margin-top:25px;

    padding:15px;

    background:#f2f2f2;

    border-radius:10px;

    color:#666;

    text-align:center;

    font-size:12px;

    line-height:1.5;
}

.goal-notice strong{
    color:#111;

    letter-spacing:.5px;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    body{
        background:#f7f6f9;
    }

    .app{
        max-width:none;

    }

    .header{

        padding-right:18px;
    }

    .header-title{
        font-size:23px;
    }

    .goal-badge{
        font-size:8px;

            7px
            8px;
    }

    .video-info{
        padding-left:15px;

    }

    .top-thumbnail{
        width:112px;
        height:150px;
    }

    .post-date{
        font-size:15px;
    }

    .stat-value{
        font-size:18px;
    }

    .tab{
        padding:
            17px
            1px
            13px;

        font-size:14px;
    }

    .content{
        padding:
            11px
            9px
            28px;
    }

    .panel{
        padding:
            23px
            20px;

        border-radius:11px;
    }

    .panel-title{
        font-size:21px;
    }

    .panel-description,
    .likes-description{
        font-size:15px;
    }


    /* BIG IMAGE */

    .video-preview{
        width:min(235px,68vw);

        margin:

            auto

    }


    /* CHART */

    .chart-wrapper{
        width:100%;

        height:205px;

        min-height:205px;

        overflow:hidden;
    }

    #likesChart{
        width:100% !important;

        height:205px !important;
    }

    .timeline-labels{
        font-size:12px;
    }

}
.top-image-wrapper{
    width:100%;
    background:#fff;
    overflow:hidden;
}

.top-image{
    display:block;
    width:100%;
    height:auto;
    object-fit:contain;
}

/* TELEPHONE */
@media(max-width:600px){
    .top-image{
        width:100%;
        height:auto;

}

/* =========================================
   SMALL PHONES
========================================= */

@media(max-width:390px){

    .header-title{
        font-size:21px;
    }

    .goal-badge{
        font-size:7px;

            6px;
    }

    .top-thumbnail{
        width:105px;
        height:142px;
    }

    .stat-value{
        font-size:17px;
    }

    .tab{
        font-size:12px;
    }

    .panel{
        padding:
            21px

    }

    }

    .video-preview{

    }

        height:190px;

        min-height:190px;
    }

    #likesChart{
        height:190px !important;
    }

}

<script>

/* =========================================
   CANVAS PREPARATION
========================================= */

function prepareCanvas(canvas){

    const parent =
        canvas.parentElement;


    const width =
        Math.max(
            parent.clientWidth,
            250
        );


    const height =
        Math.max(
            parent.clientHeight,
            180
        );


    const ratio =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.style.width =
        width + "px";


    canvas.style.height =
        height + "px";


    canvas.width =
        Math.round(
            width * ratio
        );


    canvas.height =
        Math.round(
            height * ratio
        );


    const ctx =
        canvas.getContext("2d");


    ctx.setTransform(
        1,
        0,
        0,
        1,
        0,
        0
    );


    ctx.scale(
        ratio,
        ratio
    );


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    return{
        ctx:ctx,
        width:width,
        height:height
    };

}


/* =========================================
   DRAW LIKES TARGET CURVE
========================================= */

function drawLikesChart(){


    const canvas =
        document.getElementById(
            "likesChart"
        );


    if(!canvas){
        return;
    }


    const setup =
        prepareCanvas(
            canvas
        );


    const ctx =
        setup.ctx;


    const W =
        setup.width;


    const H =
        setup.height;


    /*
        Timeline target:
        0s -> 34s

        Main desired peak:
        around 15 seconds.
    */


    const values = [

        5,
        7,
        9,
        8,
        7,
        7,
        8,
        9,
        11,
        12,

        14,
        16,
        18,
        21,
        24,

        28,

        23,
        20,
        17,
        14,

        12,
        10,
        9,
        8,
        7,

        6,
        6,
        5,
        5,
        4,

        4,
        3,
        3,
        2,
        2

    ];


    const maxValue = 30;


    const left = 14;
    const right = 48;
    const top = 20;
    const bottom = 28;


    const graphWidth =
        Math.max(
            W - left - right,
            100
        );


    const graphHeight =
        Math.max(
            H - top - bottom,
            80
        );


    /* =====================================
       GRID
    ===================================== */


    const grids = [
        30,
        20,
        10
    ];


    ctx.font =
        "12px Arial";


    grids.forEach(
        function(value){


            const y =
                top +
                graphHeight -
                (
                    value /
                    maxValue
                )
                * graphHeight;


            ctx.beginPath();


            ctx.setLineDash(
                [4,4]
            );


            ctx.strokeStyle =
                "#d0d0d0";


            ctx.lineWidth =
                1;


            ctx.moveTo(
                left,
                y
            );


            ctx.lineTo(
                W - right,
                y
            );


            ctx.stroke();


            ctx.setLineDash(
                []
            );


            ctx.fillStyle =
                "#888";


            ctx.fillText(
                value + "%",
                W - 42,
                y + 4
            );


        }
    );


    /* =====================================
       POINTS
    ===================================== */


    const points =
        values.map(
            function(value,index){


                return{


                    x:
                        left +
                        (
                            index /
                            (
                                values.length - 1
                            )
                        )
                        * graphWidth,


                    y:
                        top +
                        graphHeight -
                        (
                            value /
                            maxValue
                        )
                        * graphHeight


                };


            }
        );


    /* =====================================
       LIGHT AREA
    ===================================== */


    const gradient =
        ctx.createLinearGradient(
            0,
            top,
            0,
            top + graphHeight
        );


    gradient.addColorStop(
        0,
        "rgba(20,140,210,.20)"
    );


    gradient.addColorStop(
        1,
        "rgba(20,140,210,.02)"
    );


    ctx.beginPath();


    ctx.moveTo(
        points[0].x,
        top + graphHeight
    );


    points.forEach(
        function(point){


            ctx.lineTo(
                point.x,
                point.y
            );


        }
    );


    ctx.lineTo(
        points[
            points.length - 1
        ].x,
        top + graphHeight
    );


    ctx.closePath();


    ctx.fillStyle =
        gradient;


    ctx.fill();


    /* =====================================
       BLUE CURVE
    ===================================== */


    ctx.beginPath();


    points.forEach(
        function(point,index){


            if(index === 0){


                ctx.moveTo(
                    point.x,
                    point.y
                );


            }else{


                ctx.lineTo(
                    point.x,
                    point.y
                );


            }


        }
    );


    ctx.strokeStyle =
        "#118bd7";


    ctx.lineWidth =
        2;


    ctx.lineJoin =
        "round";


    ctx.lineCap =
        "round";


    ctx.stroke();


    /* =====================================
       START DOT
    ===================================== */


    ctx.beginPath();


    ctx.arc(
        points[0].x,
        points[0].y,
        4.5,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "#fff";


    ctx.fill();


    ctx.strokeStyle =
        "#118bd7";


    ctx.lineWidth =
        2.5;


    ctx.stroke();


    /* =====================================
       0:15 TARGET MARKER
    ===================================== */


    const targetSecond =
        15;


    const totalDuration =
        34;


    const targetX =
        left +
        (
            targetSecond /
            totalDuration
        )
        * graphWidth;


    ctx.beginPath();


    ctx.setLineDash(
        [4,4]
    );


    ctx.moveTo(
        targetX,
        top
    );


    ctx.lineTo(
        targetX,
        top + graphHeight
    );


    ctx.strokeStyle =
        "rgba(0,0,0,.22)";


    ctx.lineWidth =
        1;


    ctx.stroke();


    ctx.setLineDash(
        []
    );


    /* MARKER DOT */


    const markerIndex =
        Math.min(
            targetSecond,
            points.length - 1
        );


    const markerY =
        points[
            markerIndex
        ].y;


    ctx.beginPath();


    ctx.arc(
        targetX,
        markerY,
        6,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "#fff";


    ctx.fill();


    ctx.strokeStyle =
        "#118bd7";


    ctx.lineWidth =
        3;


    ctx.stroke();


    /* TARGET TEXT */


    ctx.fillStyle =
        "#555";


    ctx.font =
        "bold 11px Arial";


    const labelX =
        Math.min(
            targetX + 6,
            W - 87
        );


    ctx.fillText(
        " 0:22",
        labelX,
        top + 13
    );


}


/* =========================================
   DRAW
========================================= */

function drawAll(){

    drawLikesChart();

}


/* DOM READY */

document.addEventListener(
    "DOMContentLoaded",
    function(){


        requestAnimationFrame(
            function(){


                requestAnimationFrame(
                    drawAll
                );


            }
        );


    }
);


/* FULL LOAD */

window.addEventListener(
    "load",
    function(){


        setTimeout(
            drawAll,
            100
        );


        setTimeout(
            drawAll,
            350
        );


    }
);


/* RESIZE */

let resizeTimer;


window.addEventListener(
    "resize",
    function(){


        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(
                drawAll,
                120
            );


    }
);


/* PHONE ROTATION */

window.addEventListener(
    "orientationchange",
    function(){


        setTimeout(
            drawAll,
            250
        );


    }
);


/* CONTAINER RESIZE */

if(
    "ResizeObserver"
    in window
){

    const observer =
        new ResizeObserver(
            function(){


                clearTimeout(
                    resizeTimer
                );


                resizeTimer =
                    setTimeout(
                        drawAll,
                        80
                    );


            }
        );


    const chart =
        document.querySelector(
            ".chart-wrapper"
        );


    if(chart){

        observer.observe(
            chart
        );

    }

}

</script>


</body>
